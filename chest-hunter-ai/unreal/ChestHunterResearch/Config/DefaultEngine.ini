; Chest Hunter research arena - engine configuration.
; Low-cost rendering: no Lumen, no Nanite requirement, no virtual shadows, no motion blur,
; no auto exposure, FXAA. The agent only needs a stable, cheap camera image.

[/Script/EngineSettings.GameMapsSettings]
; The arena is built procedurally at runtime from Content/ResearchData/research_arena_3d.json.
; Scripts/create_research_map.py creates /Game/Maps/ResearchArena3D (with a NavMeshBoundsVolume)
; and sets it as the default map; until then the engine's empty Entry map is used.
GameDefaultMap=/Game/Maps/ResearchArena3D.ResearchArena3D
EditorStartupMap=/Game/Maps/ResearchArena3D.ResearchArena3D
GlobalDefaultGameMode=/Script/ChestHunterResearch.ResearchGameMode

[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
r.GenerateMeshDistanceFields=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.LensFlare=False
r.AntiAliasingMethod=1
r.Nanite.ProjectEnabled=False
r.Lumen.HardwareRayTracing=False

[/Script/Engine.Engine]
; Deterministic stepping: one engine tick = 1/30 simulated second regardless of host speed.
bUseFixedFrameRate=True
FixedFrameRate=30.000000
bSmoothFrameRate=False

[/Script/NavigationSystem.RecastNavMesh]
RuntimeGeneration=Dynamic
AgentRadius=35.0
AgentHeight=180.0
AgentMaxStepHeight=55.0
AgentMaxSlope=46.0
CellSize=10.0
CellHeight=10.0
bDrawPolyEdges=False

[/Script/NavigationSystem.NavigationSystemV1]
bAutoCreateNavigationData=True
bAllowClientSideNavigation=False
DataGatheringMode=Instant

[ResearchBridge]
; Loopback only. The server refuses any other bind address.
BindAddress=127.0.0.1
Port=47820
MaxHeaderBytes=65536
MaxPayloadBytes=8388608
ClientTimeoutSeconds=30
