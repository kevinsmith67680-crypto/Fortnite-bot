[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chest-hunter-ai"
version = "0.1.0"
description = "Lightweight autonomous chest-hunting research agent in a 2D simulator: SQLite data, navigation and classical computer vision."
readme = "README.md"
requires-python = ">=3.11"
# Phases 1-2 use only the standard library. Phase 3 visual perception needs
# NumPy and OpenCV (the headless build: no GUI libraries are pulled in).
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
chest-hunter = "chest_hunter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chest_hunter = ["py.typed"]
